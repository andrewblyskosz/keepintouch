<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}img{max-width:100%}body{margin:0}</style></head><body>
<title>Keep in Touch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: social-feed shell — dark test strip, sticky white top bar with icon tabs, one 680px column of white cards on grey */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --sunk:#F0F2F5; --hover:#E4E8EC; --ink:#14202C; --muted:#5A6573; --line:#DCE1E7;
  --brand:#184C7C; --brand-ink:#FFFFFF; --brand-soft:#DCE8F3; --brass:#F3991E; --brass-soft:#FDEBD2; --mark-tile:transparent; --bar-bg:#184C7C; --bar-ink:#FFFFFF; --bar-muted:#C3D3E3; --bar-brand:#FFFFFF; --bar-accent:#F3991E; --bar-hover:rgba(255,255,255,.1); --alert:#D33A3A; --warn:#A5482F;
  --lb-bg:rgba(8,12,11,.97); --lb-ink:#FFFFFF; --lb-muted:#B8C2BF; --strip:#22282A; --strip-ink:#E9EEEC; --strip-muted:#A9B4B0; --strip-line:#465052; --strip-field:#30383A;
  --font:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111418; --surface:#1C2127; --sunk:#252B33; --hover:#2D343D; --ink:#E7ECF1; --muted:#A2ADBA; --line:#313943;
  --brand:#41A2D7; --brand-ink:#08131C; --brand-soft:#16344D; --brass:#F3A43A; --brass-soft:#3A2A12; --alert:#F0625F; --warn:#E58A6F;
  --strip:#0A0D0C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111418; --surface:#1C2127; --sunk:#252B33; --hover:#2D343D; --ink:#E7ECF1; --muted:#A2ADBA; --line:#313943;
  --brand:#41A2D7; --brand-ink:#08131C; --brand-soft:#16344D; --brass:#F3A43A; --brass-soft:#3A2A12; --alert:#F0625F; --warn:#E58A6F;
  --strip:#0A0D0C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar-bg)}
button{font:inherit;cursor:pointer;border:0;border-radius:6px}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 11px;min-width:0;width:100%}
textarea{resize:vertical;min-height:70px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.hint,.fine{margin:0;font-size:13px;color:var(--muted)}
.err{color:var(--warn);font-size:13px;margin:0}
h2{margin:0;font-size:20px;font-weight:700}
.ct{font-size:18px}

/* test strip */
.strip{background:var(--strip);color:var(--strip-ink);font-size:13px}
.strip-in{max-width:712px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;display:flex;flex-direction:column;gap:8px}
.strip-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.strip-tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--brass);color:#1B1407;padding:2px 7px;border-radius:4px}
.strip-lbl{color:var(--strip-muted)}
.strip select{width:auto;flex:1 1 150px;font-size:14px;padding:5px 8px;background:var(--strip-field);color:var(--strip-ink);border-color:var(--strip-line)}
.strip-btn{background:transparent;border:1px solid var(--strip-line);color:var(--strip-ink);padding:5px 10px;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.strip-btn:hover{background:var(--strip-field)}
.strip-sync{color:var(--strip-muted);font-size:12px}
.strip details summary{cursor:pointer;color:var(--strip-muted)}
.strip ol{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.strip .card{color:var(--ink)}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar-bg);color:var(--bar-ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.bar-in{max-width:712px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-top{display:flex;align-items:center;gap:8px;height:54px}
.wordmark{font-family:"Nunito",var(--font);font-size:30px;font-weight:900;letter-spacing:.03em;color:var(--bar-brand);line-height:1}
.wm{height:30px;width:auto;display:block;flex:none}
.logo-mark{width:40px;height:40px;border-radius:10px;background:var(--mark-tile);padding:2px;display:block;flex:none}
.bar-sub{font-size:13px;color:var(--bar-muted);padding-top:6px}
.bar-me{margin-left:auto;background:transparent;padding:0;border-radius:50%;display:flex}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tabs button{background:transparent;color:var(--bar-muted);height:50px;display:flex;align-items:center;justify-content:center;gap:8px;position:relative;border-radius:8px 8px 0 0;font-weight:600;font-size:14px}
.tabs button:hover{background:var(--bar-hover)}
.tabs button[aria-selected="true"]{color:var(--bar-brand)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:6px;right:6px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--bar-accent)}
.ti{position:relative;display:inline-flex}
.badge{position:absolute;top:-7px;right:-11px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--alert);color:#FFFFFF;font-size:11px;font-weight:700;line-height:19px;text-align:center;border:2px solid var(--bar-bg)}
.tl{display:none}
@media (min-width:560px){.tl{display:inline}}
@media (max-width:360px){.bar-sub{display:none}}

/* feed */
.main{max-width:712px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.col{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.1);padding:12px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.divider{height:1px;background:var(--line);margin-inline:-16px}
.av{flex:none;width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#FFFFFF;font-weight:700;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.ghost{background:var(--sunk);color:var(--muted)}
.compose-row{display:flex;gap:10px;align-items:center}
.pill{flex:1;text-align:left;background:var(--sunk);color:var(--muted);border-radius:999px;padding:10px 16px;font-size:16px;min-width:0}
.pill:hover{background:var(--hover)}
.compose-form{display:flex;flex-direction:column;gap:10px}
.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
.compose-foot{display:flex;gap:8px;align-items:flex-start;color:var(--muted);font-size:13px}
.compose-foot svg{flex:none;color:var(--brand);margin-top:1px}
.post-head{display:flex;gap:10px;align-items:center}
.who{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.who b{font-size:15px;font-weight:600}
.meta{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:4px}
.meta svg{flex:none}
.post-text{margin:0}
.actions{display:flex;border-top:1px solid var(--line);margin:0 -16px -4px;padding:4px 8px 0}
.act-btn{flex:1;background:transparent;color:var(--muted);font-weight:600;padding:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.act-btn:hover{background:var(--hover)}
.status{flex:none;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;align-self:center}
.s-wait{background:var(--sunk);color:var(--muted)}
.s-check{background:var(--brass-soft);color:var(--ink)}
.s-conn{background:var(--brand-soft);color:var(--brand)}
.req-row{display:flex;gap:12px;align-items:flex-start}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns.center{justify-content:center}
.primary{background:var(--brand);color:var(--brand-ink);font-weight:600;padding:9px 14px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.primary:disabled{opacity:.5;cursor:default}
.grey,.secondary{background:var(--sunk);color:var(--ink);font-weight:600;padding:9px 14px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.grey:hover,.secondary:hover{background:var(--hover)}
.req .btns button{flex:1 1 130px}
.link{background:transparent;color:var(--muted);padding:2px 0;font-size:13px;font-weight:600;align-self:flex-start}
.link:hover{text-decoration:underline}
.link.warn{color:var(--warn)}
.glow{box-shadow:0 0 0 2px var(--brass),0 1px 2px rgba(0,0,0,.1)}
.big-photo{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding-block:4px}
.comments{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow:auto}
.cmt{display:flex;gap:8px;align-items:flex-start}
.bubble{background:var(--sunk);border-radius:16px;padding:7px 12px;display:flex;flex-direction:column;min-width:0;max-width:85%;overflow-wrap:anywhere}
.bubble b{font-size:13px}
.cmt-input{display:flex;gap:8px;align-items:center}
.pill-input{flex:1;display:flex;align-items:center;background:var(--sunk);border-radius:999px;padding:2px 4px 2px 14px;min-width:0}
.pill-input input{border:0;background:transparent;padding:8px 0;flex:1}
.pill-input input:focus-visible{outline:none}
.pill-input:focus-within{outline:2px solid var(--brand);outline-offset:1px}
.icon-btn{background:transparent;color:var(--brand);width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon-btn:hover{background:var(--hover)}
.empty{align-items:center;text-align:center;color:var(--muted);padding:28px 16px}
.empty svg{color:var(--brand)}

/* profile */
.profile{padding:0;overflow:hidden;gap:0}
.cover{height:150px;background-color:var(--brand);background-image:radial-gradient(var(--brand-soft) 1.3px,transparent 1.6px);background-size:18px 18px}
.prof-main{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:0 16px 16px;margin-top:-66px}
.prof-av{position:relative}
.prof-av .av{border:4px solid var(--surface)}
.cam{position:absolute;right:2px;bottom:8px;width:38px;height:38px;border-radius:50%;background:var(--sunk);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid var(--surface)}
.cam:hover{background:var(--hover)}
.prof-name{margin:0;font-size:26px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.hist{display:flex;flex-direction:column;gap:8px}
.hist-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.hist-row .hc{grid-column:2/span 2}
.hist-row+.hist-row{border-top:1px solid var(--line);padding-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.notice{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--brass-soft);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:14px}
.notice svg{flex:none}
.notice span{flex:1 1 180px}
.inline-fix{display:flex;gap:8px}
.x{background:transparent;color:var(--muted);padding:6px;font-size:20px;line-height:1}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.switch{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch[aria-checked="true"]{background:var(--brand)}
.switch[aria-checked="true"]::after{left:23px}
.guards{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.guards li{display:flex;gap:10px;align-items:flex-start}
.guards svg{flex:none;color:var(--brand);margin-top:1px}

.cover{position:relative;overflow:hidden}
.net{position:absolute;inset:0;width:100%;height:100%;display:block}
.ct-wm{display:flex;align-items:center;gap:.3em;flex-wrap:wrap}
.wm-inline{height:.82em;width:auto;display:inline-block}
.danger-btn{background:var(--warn);color:var(--surface);font-weight:600;padding:9px 14px;border-radius:6px}
.foot{margin-top:24px;text-align:center;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px;padding-inline:8px}
.foot p{margin:0;max-width:60ch;margin-inline:auto}
.foot .link,.link.inline{display:inline;font-size:inherit;padding:0;align-self:auto}
.link.inline{color:var(--brand);text-decoration:underline}
.terms{display:flex;flex-direction:column;gap:6px;padding-top:8px;border-top:1px solid var(--line);scroll-margin-top:120px}
.terms p,.terms li{margin:0;font-size:14px;line-height:1.5}
.terms ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px;cursor:pointer}
.check input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:var(--brand);padding:0}
/* photo gallery + viewer */
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
@media (min-width:520px){.gal{grid-template-columns:repeat(5,minmax(0,1fr))}}
.gal-item{position:relative;aspect-ratio:1;max-width:100%}
.gal-open{padding:0;width:100%;height:100%;border-radius:8px;overflow:hidden;background:var(--sunk);display:block}
.gal-open img,.thumb img,.lb-th img{width:100%;height:100%;object-fit:cover;display:block}
.gal-del{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.6);color:#FFFFFF;display:flex;align-items:center;justify-content:center;padding:0}
.gal-add{aspect-ratio:1;max-width:100%;border:2px dashed var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);cursor:pointer;font-size:13px;font-weight:600;text-align:center}
.gal-add:hover{background:var(--hover)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumb{width:56px;height:56px;padding:0;border-radius:8px;overflow:hidden;position:relative;background:var(--sunk)}
.thumb .more{position:absolute;inset:0;background:rgba(0,0,0,.55);color:#FFFFFF;font-weight:700;display:flex;align-items:center;justify-content:center}
.lb{position:fixed;inset:0;z-index:60;background:var(--lb-bg);color:var(--lb-ink);display:flex;flex-direction:column;gap:10px;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.lb .who b{color:var(--lb-ink)}
.lb .meta{color:var(--lb-muted)}
.lb-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lb-x{color:var(--lb-ink)}
.lb-x:hover{background:rgba(255,255,255,.12)}
.lb-stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.55);color:#FFFFFF;display:flex;align-items:center;justify-content:center;padding:0}
.lb-nav.prev{left:4px}
.lb-nav.next{right:4px}
.lb-nav:disabled{opacity:.3;cursor:default}
.lb-thumbs{display:flex;gap:6px;overflow-x:auto;flex:none;padding-bottom:2px}
.lb-thumbs>:first-child{margin-left:auto}
.lb-thumbs>:last-child{margin-right:auto}
.lb-th{flex:none;width:52px;height:52px;padding:0;border-radius:6px;overflow:hidden;opacity:.55;border:2px solid transparent}
.lb-th.on{opacity:1;border-color:var(--lb-ink)}

/* photo positioner */
.crop{position:fixed;inset:0;z-index:50;background:rgba(10,20,17,.6);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.crop-box{background:var(--surface);border-radius:12px;padding:18px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
.crop-view{width:280px;max-width:100%;aspect-ratio:1;align-self:center;border-radius:50%;overflow:hidden;background:var(--sunk);touch-action:none;cursor:grab;box-shadow:0 0 0 3px var(--brand)}
.crop-view:active{cursor:grabbing}
.crop-view canvas{width:100%;height:100%;display:block}
input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--brand)}
@media (prefers-reduced-motion:reduce){.switch::after{transition:none}}
@media (max-width:380px){.grid3{grid-template-columns:1fr 1fr}.grid3 .wide{grid-column:1/-1}}
@media (max-width:360px){.grid2{grid-template-columns:1fr}}
</style>

<div class="app" id="app"></div>
<div class="crop" id="crop" hidden role="dialog" aria-modal="true" aria-labelledby="cropTitle">
  <div class="crop-box">
    <h2 id="cropTitle">Position your photo</h2>
    <p class="hint">Drag to move it. Use the slider to zoom in or out.</p>
    <div class="crop-view" id="cropView" tabindex="0" aria-label="Photo preview. Drag or use arrow keys to move."><canvas id="cropCanvas" width="280" height="280"></canvas></div>
    <label class="f" for="cropZoom">Zoom<input id="cropZoom" type="range" min="1" max="4" step="0.01" value="1"></label>
    <div class="btns"><button class="primary" id="cropSave">Use photo</button><button class="secondary" id="cropCancel">Cancel</button></div>
  </div>
</div>

<script>
/* ---------- data ---------- */
const KEY="kiml.demo.v1";
const blankPerson=(id,name,hue)=>({id,name,past:[],history:[{place:"",city:"",from:1985,to:1990}],joined:true,paused:false,never:[],blocked:[],photo:"",hue});
const seed=()=>({
  current:"u_andrew", tab:"me", v:2,
  users:{u_andrew:blankPerson("u_andrew","Andrew B.",205),u_nicole:blankPerson("u_nicole","Nicole G.",330)},
  picks:[], decisions:{}, confirms:{}, messages:{}, gone:{users:[],picks:[]}, err:""
});
const EXAMPLE_IDS=["u_lisa","u_jon","u_john","u_karen","u_dev"];
let S;
try{S=JSON.parse(localStorage.getItem(KEY));}catch(e){}
if(!S||!S.users)S=seed();
S.gone=S.gone||{users:[],picks:[]};
S.viewing=null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

/* ---------- JSONBin sync ---------- */
const SYNC_KEY="kiml.sync.v1";
let SY={bin:"",key:""};
try{SY=JSON.parse(localStorage.getItem(SYNC_KEY))||SY;}catch(e){}
const saveSync=()=>{try{localStorage.setItem(SYNC_KEY,JSON.stringify(SY))}catch(e){}};
const onClaude=/claude\.ai|claudeusercontent|claude\.site/.test(location.hostname);
let syncMsg=SY.bin?"Not synced yet":"Not set up", pushTimer=null, syncing=false;
const isOurs=d=>!!d&&(d.app==="keep-in-touch"||d.app==="keep-in-my-life");
const payload=()=>({app:"keep-in-touch",v:1,users:S.users,picks:S.picks,decisions:S.decisions,confirms:S.confirms,messages:S.messages,gone:S.gone,removedAt:S.removedAt||{},coolClear:S.coolClear||0});
async function binFetch(method,body){
  const url="https://api.jsonbin.io/v3/b/"+encodeURIComponent(SY.bin.trim())+(method==="GET"?"/latest":"");
  const go=hdr=>fetch(url,{method,headers:{"Content-Type":"application/json","X-Bin-Meta":"false",[hdr]:SY.key.trim()},body:body?JSON.stringify(body):undefined});
  let r=await go("X-Access-Key");
  if(r.status===401||r.status===403)r=await go("X-Master-Key");
  if(!r.ok){const t=await r.text().catch(()=>"");
    throw new Error(r.status===401||r.status===403?"JSONBin refused the key. Check that it has Read and Update access to bins."
      :r.status===404?"JSONBin couldn't find that bin. Check the Bin ID."
      :r.status===413?"The data is too big for your JSONBin plan. Remove some photos and try again."
      :"JSONBin said: "+(t.slice(0,140)||r.status));}
  return r.json();}
async function pull(){if(!SY.bin||!SY.key||syncing)return;syncing=true;syncMsg="Syncing…";render();
  try{const d=await binFetch("GET");if(isOurs(d))merge(d);save();syncMsg="Synced at "+new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});}
  catch(e){syncMsg=e.message.includes("Failed to fetch")?"Can't reach JSONBin. Check your connection"+(onClaude?", and open the downloaded or GitHub copy instead.":"."):e.message;}
  syncing=false;render();}
async function push(){if(!SY.bin||!SY.key)return;syncing=true;syncMsg="Saving…";render();
  try{const d=await binFetch("GET");if(isOurs(d))merge(d);
    await binFetch("PUT",payload());save();syncMsg="Saved at "+new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});}

function resetCard(){const synced=!!(SY.bin&&SY.key);return `<div class="card" role="alertdialog" aria-labelledby="rsTitle">

function notJoined(){const u=me();return `<div class="card empty">${av(u,72)}

const photoNotice=(text,btn)=>`<div class="notice">${ic("camera",18)}<span>${text}</span><button class="grey" data-tab="me">${btn}</button></div>`;

function people(){const u=me();const mine=S.picks.filter(p=>p.owner===u.id);const F=firstName(u);

    <div class="compose-row">${av(u)}<button class="pill" data-act="compose" aria-expanded="${open}">Who do you miss${F?", "+esc(F):""}?</button></div>
    ${!hasPhoto(u)?photoNotice("Add a profile photo so people can see who's reaching out. Your list isn't sent until you do.","Add photo"):""}
    ${open?`<div class="compose-form">
      <label class="f" for="np_name">Name you knew them by<input id="np_name" value="${esc(d.name)}" placeholder="e.g. Sarah Bennett" autocomplete="off"></label>

  :`<div class="card empty">${ic("search",32)}<b style="color:var(--ink)">No one on your list yet</b><span>Tap "Who do you miss?" to add your first person.</span></div>`}`;}

function requests(){const u=me();const inb=inbox(u.id),conf=toConfirm(u.id);

      :`${photoNotice("Add a profile photo first, so they can check it's really you.","Add photo")}<div class="btns"><button class="grey" data-act="decide" data-k="${esc(p.id)}|${esc(u.id)}" data-v="ignored">Not now</button></div>`}

  return h;}

/* ---------- actions ---------- */
function act(a,el){const u=me();
  if(a==="agree"){const ck=document.getElementById("agree_ck");if(ck&&ck.checked){u.agreed=true;u.agreedAt=Date.now();S.agreeErr="";S.tab=S.tab==="me"?"me":"people";}else{S.agreeErr="Tick the box to continue.";save();render();return;}}
  else if(a==="askReset"){S.confirmReset=true;save();render();return;}
  else if(a==="cancelReset"){S.confirmReset=false;save();render();return;}
  else if(a==="reset"){const synced=!!(SY.bin&&SY.key);S=seed();S.tools=true;S.fresh=synced;save();render();if(synced)pull();return;}
  else if(a==="toggleTools"){S.tools=!S.tools;save();render();return;}
  else if(a==="viewPhotos"){const id=el.dataset.id;if(canSee(S.current,id))S.viewing={uid:id,i:+el.dataset.i||0};render();return;}
  else if(a==="closeView"){S.viewing=null;render();return;}
  else if(a==="viewStep"||a==="viewAt"){if(S.viewing){const n=galleryOf(S.users[S.viewing.uid]).length;const i=a==="viewAt"?+el.dataset.i:S.viewing.i+(+el.dataset.d);S.viewing.i=Math.max(0,Math.min(n-1,i));}render();return;}
  else if(a==="delGal"){const g=u.gallery||[];g.splice(+el.dataset.i,1);u.gallery=g;S.galMsg="";}
  else if(a==="compose"){S.compose=!(S.compose||S.err);S.err="";if(!S.compose)S.draft={};save();render();if(S.compose)setTimeout(()=>{const e=document.getElementById("np_name");if(e)e.focus();},0);return;}
  else if(a==="toggleSync"){S.showSync=!S.showSync;save();render();return;}
  else if(a==="saveSync"){SY.bin=val("sync_bin");SY.key=val("sync_key");saveSync();
    if(!SY.bin||!SY.key){syncMsg="Add both the Bin ID and the key.";render();return;}
    S.showSync=false;save();push();return;}
  else if(a==="stopSync"){SY={bin:"",key:""};saveSync();syncMsg="Not set up";render();return;}
  else if(a==="syncNow"){push();return;}
  else if(a==="hideExamples"){for(const id of EXAMPLE_IDS){if(id===S.current||!S.users[id])continue;
      if(!S.gone.users.includes(id))S.gone.users.push(id);delete S.users[id];}
    S.picks=S.picks.filter(p=>{if(S.users[p.owner])return true;if(!S.gone.picks.includes(p.id))S.gone.picks.push(p.id);return false;});
    if(!S.users[S.current])S.current=Object.keys(S.users)[0];}
  else if(a==="toggleShare"){S.share=!S.share;S.shareMsg="";S.exportText="";}
  else if(a==="copyData"){const text=JSON.stringify(payload());
    S.exportText=text;S.shareMsg="Copied. Paste it into a message to them.";
    try{navigator.clipboard.writeText(text).catch(()=>{S.shareMsg="Couldn't copy automatically. Select the text in the box and copy it.";render();});}catch(e){S.shareMsg="Couldn't copy automatically. Select the text in the box and copy it.";}}
  else if(a==="importData"){importText(val("imp"));}
  else if(a==="addUser"){const id="u_"+Date.now().toString(36);S.users[id]={id,name:"",past:[],history:[{place:"",city:"",from:1985,to:1990}],joined:false,paused:false,never:[],blocked:[],photo:"",hue:Math.floor(Math.random()*360)};S.current=id;S.tab="me";}
  else if(a==="join"){u.joined=true;}
  else if(a==="leave"){u.joined=false;}
  else if(a==="pause"){u.paused=!u.paused;}
  else if(a==="addPick"){const name=val("np_name"),place=val("np_place"),city=val("np_city");let f=parseInt(val("np_from")),t=parseInt(val("np_to"));
    S.draft={name,place,city,from:val("np_from"),to:val("np_to")};
    if(!t&&f)t=f; if(f>t)[f,t]=[t,f];
    const locked=lockedSlots(u.id);
    if(!parts(name).first)S.err="Add the name you knew them by.";
    else if(!place)S.err="Add where you knew them. It's how we keep names private.";
    else if(!city)S.err="Add the city or town. It's the second detail that has to match.";
    else if(!f||f<1930||t>2026)S.err="Add roughly which years, like 1985 to 1989.";
    else if(t-f>MAX_SPAN)S.err=`Keep it to ${MAX_SPAN} years or less. Pick the years you're most sure of.`;
    else if(slotsUsed(u.id)>=MAX_PICKS)S.err=locked.length?`Your list is full. Removed spots start unlocking ${unlockDate(locked)}.`:"Your list is full. Remove someone to add another.";
    else if(namesOf(u).some(n=>fullSim(n,name)))S.err="That looks like your own name.";
    else{S.picks.push({id:"p"+Date.now().toString(36),owner:u.id,name,place,city,from:f,to:t});S.err="";S.compose=false;S.draft={};}}
  else if(a==="askDel"){S.confirmDel=el.dataset.id;}
  else if(a==="cancelDel"){S.confirmDel="";}
  else if(a==="delPick"){const id=el.dataset.id,p=S.picks.find(x=>x.id===id);if(p){S.removedAt=S.removedAt||{};S.removedAt[id]={owner:p.owner,at:Date.now()};}
    S.picks=S.picks.filter(x=>x.id!==id);if(!S.gone.picks.includes(id))S.gone.picks.push(id);S.confirmDel="";}
  else if(a==="setPickCity"){const p=S.picks.find(x=>x.id===el.dataset.id),c=val("pc_"+el.dataset.id);if(p&&c)p.city=c;}
  else if(a==="clearCool"){S.coolClear=Date.now();}
  else if(a==="decide"){S.decisions[el.dataset.k]=el.dataset.v;}
  else if(a==="confirm"){S.confirms[el.dataset.k]=el.dataset.v;}
  else if(a==="block"){if(!u.blocked.includes(el.dataset.id))u.blocked.push(el.dataset.id);}
  else if(a==="unblock"){u.blocked=u.blocked.filter(x=>x!==el.dataset.id);}
  else if(a==="send"){const pk=el.dataset.pk,inp=document.getElementById("m_"+pk);const text=(inp&&inp.value||"").trim();if(text){(S.messages[pk]=S.messages[pk]||[]).push({from:u.id,text,ts:Date.now()});}}
  else if(a==="addHist"){u.history.push({place:"",city:"",from:1985,to:1990});}
  else if(a==="delHist"){u.history.splice(+el.dataset.i,1);}
  else if(a==="clearPhoto"){u.photo="";}
  save();render();if(a!=="reset"&&a!=="toggleShare"&&a!=="copyData")schedulePush();}
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():"";};
function importText(raw){let d;
  try{d=JSON.parse(raw);}catch(e){S.shareMsg="That doesn't look like Keep in Touch data. Paste the whole block they sent, from the first { to the last }.";return;}
  if(!isOurs(d)||!d.users){S.shareMsg="That doesn't look like Keep in Touch data.";return;}
  const [nu,np]=merge(d);
  S.shareMsg=`Done. Added ${nu} new ${nu===1?"person":"people"} and ${np} new ${np===1?"pick":"picks"}. Check Requests and Reconnected.`;
  schedulePush();}
function merge(d){
  let nu=0,np=0;
  const g=d.gone||{};
  S.removedAt=S.removedAt||{};for(const k in d.removedAt||{})if(!(k in S.removedAt))S.removedAt[k]=d.removedAt[k];
  S.coolClear=Math.max(S.coolClear||0,+d.coolClear||0);
  for(const p of d.picks||[]){const l=p&&S.picks.find(x=>x.id===p.id);if(l&&!l.city&&p.city)l.city=p.city;}
  for(const id of g.users||[])if(!S.gone.users.includes(id))S.gone.users.push(id);
  for(const id of g.picks||[])if(!S.gone.picks.includes(id))S.gone.picks.push(id);
  for(const [id,u] of Object.entries(d.users||{})){if(!u||typeof u!=="object"||S.gone.users.includes(id))continue;
    if(!S.users[id]){nu++;S.users[id]=u;}else if(id!==S.current||S.fresh){S.users[id]=u;}}
  for(const id of S.gone.users)if(id!==S.current)delete S.users[id];
  const have=new Set(S.picks.map(p=>p.id));
  for(const p of d.picks||[])if(p&&p.id&&!have.has(p.id)&&!S.gone.picks.includes(p.id)&&S.users[p.owner]){S.picks.push(p);np++;}
  S.picks=S.picks.filter(p=>!S.gone.picks.includes(p.id)&&S.users[p.owner]);
  for(const k in d.decisions||{})if(!(k in S.decisions))S.decisions[k]=d.decisions[k];
  for(const k in d.confirms||{})if(!(k in S.confirms))S.confirms[k]=d.confirms[k];
  for(const pk in d.messages||{}){const cur=S.messages[pk]||[];const seen=new Set(cur.map(m=>m.from+"|"+m.ts+"|"+m.text));
    for(const m of d.messages[pk]||[])if(m&&!seen.has(m.from+"|"+m.ts+"|"+m.text))cur.push(m);
    cur.sort((a,b)=>(a.ts||0)-(b.ts||0));S.messages[pk]=cur;}
  if(!S.users[S.current])S.current=Object.keys(S.users)[0];
  S.fresh=false;
  return [nu,np];}

document.addEventListener("click",e=>{const t=e.target.closest("[data-act],[data-tab]");if(!t)return;
  if(t.dataset.tab){S.tab=t.dataset.tab;S.err="";save();render();const sec=t.dataset.sec&&document.getElementById(t.dataset.sec);if(sec)sec.scrollIntoView();else if(t.dataset.tab==="terms")window.scrollTo(0,0);return;}
  act(t.dataset.act,t);});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id&&e.target.id.startsWith("m_")){const b=e.target.parentElement.querySelector("[data-act=send]");if(b)b.click();}});
document.addEventListener("change",e=>{const t=e.target,u=me();
  if(t.id==="gal_add"&&t.files&&t.files.length){addGallery([...t.files]);return;}
  if(t.id==="imp_file"&&t.files[0]){const r=new FileReader();r.onload=()=>{importText(String(r.result));save();render();};r.readAsText(t.files[0]);return;}
  if(t.id==="who"){S.current=t.value;S.err="";}
  else if(t.id==="me_name"){u.name=t.value.trim();}
  else if(t.id==="me_past"){u.past=t.value.split(",").map(s=>s.trim()).filter(Boolean);}
  else if(t.id==="me_never"){u.never=t.value.split("\n").map(s=>s.trim()).filter(Boolean);}
  else if(t.dataset.h!=null){const h=u.history[+t.dataset.h];h[t.dataset.f]=(t.dataset.f==="place"||t.dataset.f==="city")?t.value.trim():(parseInt(t.value)||h[t.dataset.f]);}
  else if(t.id==="me_photo"&&t.files[0]){openCrop(t.files[0]);return;}
  else return;
  save();render();if(t.id!=="who")schedulePush();});
/* ---------- photo positioner ---------- */
const V=280; let CR=null;
const cropEl=document.getElementById("crop"),cropView=document.getElementById("cropView"),cropCv=document.getElementById("cropCanvas"),cropZoom=document.getElementById("cropZoom");
function cropScale(){return Math.max(V/CR.img.width,V/CR.img.height)*CR.zoom;}
function clampCrop(){const s=cropScale(),mx=Math.max(0,(CR.img.width*s-V)/2),my=Math.max(0,(CR.img.height*s-V)/2);
  CR.x=Math.min(mx,Math.max(-mx,CR.x));CR.y=Math.min(my,Math.max(-my,CR.y));}
function drawCrop(ctx,size){const k=size/V,s=cropScale()*k,w=CR.img.width*s,h=CR.img.height*s;
  ctx.clearRect(0,0,size,size);ctx.drawImage(CR.img,size/2+CR.x*k-w/2,size/2+CR.y*k-h/2,w,h);}
const paintCrop=()=>{clampCrop();drawCrop(cropCv.getContext("2d"),V);};
function openCrop(file){const uid=S.current;const r=new FileReader();
  r.onload=()=>{const img=new Image();img.onload=()=>{CR={img,uid,zoom:1,x:0,y:0};cropZoom.value=1;cropEl.hidden=false;paintCrop();cropView.focus();};
    img.onerror=()=>{S.err="That file couldn't be opened as a photo. Try a JPG or PNG.";render();};img.src=r.result;};
  r.readAsDataURL(file);}
const closeCrop=()=>{cropEl.hidden=true;CR=null;};
let drag=null;
cropView.addEventListener("pointerdown",e=>{if(!CR)return;cropView.setPointerCapture(e.pointerId);drag={px:e.clientX,py:e.clientY,x:CR.x,y:CR.y};});
cropView.addEventListener("pointermove",e=>{if(!drag||!CR)return;const ratio=V/cropView.getBoundingClientRect().width;
  CR.x=drag.x+(e.clientX-drag.px)*ratio;CR.y=drag.y+(e.clientY-drag.py)*ratio;paintCrop();});
const endDrag=()=>{drag=null;};
cropView.addEventListener("pointerup",endDrag);cropView.addEventListener("pointercancel",endDrag);
cropView.addEventListener("wheel",e=>{if(!CR)return;e.preventDefault();CR.zoom=Math.min(4,Math.max(1,CR.zoom*(e.deltaY<0?1.06:1/1.06)));cropZoom.value=CR.zoom;paintCrop();},{passive:false});
cropView.addEventListener("keydown",e=>{if(!CR)return;const d={ArrowLeft:[-10,0],ArrowRight:[10,0],ArrowUp:[0,-10],ArrowDown:[0,10]}[e.key];
  if(d){e.preventDefault();CR.x+=d[0];CR.y+=d[1];paintCrop();}});
cropZoom.addEventListener("input",()=>{if(!CR)return;CR.zoom=parseFloat(cropZoom.value)||1;paintCrop();});
document.getElementById("cropCancel").addEventListener("click",closeCrop);
document.getElementById("cropSave").addEventListener("click",()=>{if(!CR)return;const out=200,c=document.createElement("canvas");c.width=c.height=out;
  const ctx=c.getContext("2d");ctx.fillStyle="#ffffff";ctx.fillRect(0,0,out,out);drawCrop(ctx,out);
  const u=S.users[CR.uid];if(u){u.photo=c.toDataURL("image/jpeg",.82);}
  closeCrop();save();render();schedulePush();});
cropEl.addEventListener("click",e=>{if(e.target===cropEl)closeCrop();});

document.addEventListener("keydown",e=>{if(!S.viewing)return;
  if(e.key==="Escape")act("closeView");else if(e.key==="ArrowLeft")act("viewStep",{dataset:{d:"-1"}});else if(e.key==="ArrowRight")act("viewStep",{dataset:{d:"1"}});});

render();
pull();
</script>
